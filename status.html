<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Status - Jaseem Feroz</title>
<style>
  :root {
    color-scheme: light dark;
    --ok: #1a7f4b; --okbg: #e8f6ee;
    --bad: #a8321f; --badbg: #fdecea;
    --line: #e3e5e8; --card: #fff; --bg: #f6f7f8; --txt: #16181c; --dim: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root { --line:#2b2f36; --card:#1b1e24; --bg:#101216; --txt:#e8eaed; --dim:#9aa0a6;
            --ok:#5ed39a; --okbg:#132a1f; --bad:#ff8a75; --badbg:#2d1613; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px 14px 40px; background:var(--bg); color:var(--txt);
         font:16px/1.6 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 2px; }
  .sub { color:var(--dim); font-size:13px; margin:0 0 18px; }
  .banner { border-radius:14px; padding:18px 16px; margin-bottom:16px; border:1px solid transparent; }
  .banner.ok { background:var(--okbg); border-color:var(--ok); }
  .banner.bad{ background:var(--badbg); border-color:var(--bad); }
  .banner .big { font-size:22px; font-weight:700; margin:0 0 4px; }
  .banner .why { font-size:14px; margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:14px; text-transform:uppercase; letter-spacing:.5px;
             color:var(--dim); margin:0 0 10px; }
  .next { font-size:26px; font-weight:700; }
  .next small { font-size:14px; font-weight:400; color:var(--dim); display:block; margin-top:2px; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .tag { font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px;
         background:var(--bg); border:1px solid var(--line); min-width:64px; text-align:center; }
  .when { font-size:14px; }
  .when b { display:block; }
  .when span { color:var(--dim); font-size:12px; }
  li a { margin-left:auto; text-decoration:none; font-size:13px; padding:6px 12px;
         border-radius:8px; border:1px solid var(--line); color:var(--txt); white-space:nowrap; }
  li a:active { background:var(--bg); }
  footer { text-align:center; color:var(--dim); font-size:12px; margin-top:18px; }
  .empty { color:var(--dim); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Bot ki Halaat</h1>
  <p class="sub">Jaseem Feroz &middot; auto-refresh har 2 minute</p>

  <div class="banner bad" id="banner">
    <p class="big" id="hstate">Pooch rahe hain...</p>
    <p class="why" id="hwhy">Ek second.</p>
  </div>

  <div class="card">
    <h2>Agli video</h2>
    <div class="next" id="next">--:--<small>hisab lag raha hai...</small></div>
  </div>

  <div class="card">
    <h2>Aakhri posts</h2>
    <ul id="posts"><li class="empty">Pooch rahe hain...</li></ul>
  </div>

  <footer>
    <span id="updated">--</span><br>
    <a href="index.html" style="color:var(--dim)">Privacy Policy</a>
  </footer>
</main>

<script>
const SLOTS = [
  { name: "midnight", from: 0,    to: 150,  ur: "Raat 12 baje" },
  { name: "morning",  from: 600,  to: 720,  ur: "Subah 10 baje" },
  { name: "night",    from: 1140, to: 1320, ur: "Shaam 7 baje" }
];
const URS = { midnight: "Raat wali", morning: "Behadari", night: "Shaam wali" };

const hhmm = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
const mins = s => { const p = s.split(":"); return +p[0]*60 + +p[1]; };

// "2026-10-01T10:31:00+05:00" ko Pakistan ke hisaab se minute-of-day banao
function minuteOfDay(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const pk = new Date(d.getTime() + (5*60 + d.getTimezoneOffset())*60000);
  return pk.getHours()*60 + pk.getMinutes();
}
function dateLabel(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const pk = new Date(d.getTime() + (5*60 + d.getTimezoneOffset())*60000);
  return pk.getDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][pk.getMonth()]
       + ", " + hhmm(pk.getHours()*60 + pk.getMinutes());
}

function nextPost(posts) {
  const now = new Date();
  const pk = new Date(now.getTime() + (5*60 + now.getTimezoneOffset())*60000);
  const nowM = pk.getHours()*60 + pk.getMinutes();
  const done = new Set(posts.map(p => p.at.slice(0,10) + ":" + p.slot));

  for (let add = 0; add <= 1440; add++) {
    const m = (nowM + add) % 1440;
    for (const s of SLOTS) {
      if (m >= s.from && m <= s.to) {
        const probe = new Date(pk.getTime() + add*60000);
        const key = probe.getFullYear() + "-" + (probe.getMonth()+1) + "-" + probe.getDate() + ":" + s.name;
        if (!done.has(key)) {
          return { slot: s, mins: m, days: Math.floor((nowM + add)/1440) };
        }
      }
    }
  }
  return null;
}

function draw(d) {
  const now = Date.now();
  const aliveAge = (now - new Date(d.alive_at).getTime()) / 60000;
  const freshest = d.posts && d.posts.length
    ? (now - new Date(d.posts[0].at).getTime()) / 60000 : 1e9;

  let ok = true, big, why;
  if (aliveAge > 25) { ok = false; big = "⚠️ Alarm band hai"; why = "Aakhri jaanch " + Math.round(aliveAge) + " minute pehle hui. School aakar bata dein."; }
  else if (freshest > 1300) { ok = false; big = "⚠️ Aakhri video purani hai"; why = "Aakhri post " + Math.round(freshest/60) + " ghante pehle. School aakar bata dein."; }
  else { big = "✅ Sab theek chal raha hai"; why = "Aakhri jaanch " + Math.round(aliveAge) + " minute pehle."; }

  const b = document.getElementById("banner");
  b.className = "banner " + (ok ? "ok" : "bad");
  document.getElementById("hstate").textContent = big;
  document.getElementById("hwhy").textContent = why;

  const n = nextPost(d.posts || []);
  document.getElementById("next").innerHTML = n
    ? (hhmm(n.mins) + (n.days ? " <small style='display:inline'>+ " + n.days + " din</small>" : "") +
       "<small>" + n.slot.ur + " &middot; " + URS[n.slot.name] + "</small>")
    : "--:--<small>hisab nahi lag paaya</small>";

  const ul = document.getElementById("posts");
  if (!d.posts || !d.posts.length) {
    ul.innerHTML = '<li class="empty">Abhi tak koi post nahi.</li>';
  } else {
    ul.innerHTML = d.posts.slice(0, 8).map(p =>
      '<li><span class="tag">' + hhmm(minuteOfDay(p.at)) + '</span>' +
      '<span class="when"><b>' + URS[p.slot] + '</b><span>' + dateLabel(p.at) + '</span></span>' +
      (p.video_id ? '<a href="https://www.youtube.com/watch?v=' + p.video_id + '" target="_blank" rel="noopener">dekhain</a>' : '') +
      '</li>').join("");
  }
  document.getElementById("updated").textContent = "Aakhri update: " + dateLabel(d.updated_at);
}

function load() {
  fetch("status.json?v=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(draw)
    .catch(() => {
      const b = document.getElementById("banner");
      b.className = "banner bad";
      document.getElementById("hstate").textContent = "⚠️ Page purana data";
      document.getElementById("hwhy").textContent = "Data nahi mila. Page ko refresh karein.";
    });
}
load();
setInterval(load, 120000);
</script>
</body>
</html>
