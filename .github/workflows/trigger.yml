name: trigger urdu shorts

# Ye chhoti PUBLIC repo sirf "alarm" hai. Asal code aur photos PRIVATE repo
# (urdu-quote-shorts) me hain, aur wahi video banata hai.
#
# ---- Cron kyun nahi chal raha ----
# Is account par GitHub ke scheduled runs nahi chal rahe: private repo ka
# ghante-wala cron 4-7 ghante late tha (kai roz poori tarah miss), aur is
# public repo ka cron bilkul nahi chala. Naye accounts par GitHub schedule
# ko throttle karta hai. Is liye cron pe bharosa nahi.
#
# ---- Tareeqa: chhote-chhote rung ka zanjir ----
# Ye workflow sirf 15 minute chalta hai:
#   1. Pakistan ka waqt nikalta hai (UTC+5, hamesha se, kisi tz database
#      par bharosa nahi - runner par `TZ=` chalta hi nahi)
#   2. agar is waqt koi post ka time hai, private repo ko jagata hai
#   3. KHUD ko dobara jagata hai
# Is tarah zanjir khud ko chala rakhta hai - na cron chahiye, na computer
# on hona chahiye, na 6 ghante ki limit ka masla.
#
# Photos private rehni hain, is liye ye combination chahiye: alarm public,
# maalik private. Public repo ki GitHub "minutes" unlimited hoti hain.
on:
  workflow_dispatch:
  schedule:
    # Sirf safety net: agar GitHub ka cron kabhi chalne lage to bhi theek.
    - cron: "17 * * * *"

permissions:
  contents: read

# Naya run aayega to purana band ho jayega. Is se zanjir kabhi dobara
# shuru karne par do pahaar ek saath nahi chalengi.
concurrency:
  group: alarm
  cancel-in-progress: true

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      TOKEN: ${{ secrets.DISPATCH_TOKEN }}
      PRIVATE_REPO: jaseemferoz6-lang/urdu-quote-shorts
      PRIVATE_WF: daily.yml
      SELF_REPO: jaseemferoz6-lang/jaseemferoz6-privacy
      SELF_WF: trigger.yml
      SLEEP: "840"

    steps:
      - name: Pakistan ka waqt dekho aur faisla karo
        run: |
          python3 - <<'PY' | tee /tmp/plan.txt
          import os
          from datetime import datetime, timezone, timedelta

          pkt = datetime.now(timezone(timedelta(hours=5)))
          now = pkt.hour * 60 + pkt.minute
          print(f"Pakistan waqt: {pkt:%Y-%m-%d %H:%M}  (minute index {now})")

          # ---- YEH TABLE config/config.yaml ke `slots:` se MATCH hona chahiye.
          # ---- Badalna ho to dono jagah badlein, warna post galat waqt pe.
          table = [
              ("midnight", "00:00", "02:30"),
              ("morning",  "10:00", "12:00"),
              ("night",    "19:00", "22:00"),
          ]

          def mins(hhmm):
              h, m = hhmm.split(":")
              return int(h) * 60 + int(m)

          hit = ""
          for name, a, b in table:
              lo, hi = mins(a), mins(b)
              if lo <= hi:
                  ok = lo <= now <= hi
              else:                      # window jo raat ke baad tak chalta hai
                  ok = now >= lo or now <= hi
              if ok:
                  hit = name
                  break

          if hit:
              print(f"is waqt {hit} ka waqt hai -> private repo ko bhej rahe hain")
          else:
              print("is waqt koi post nahi -> private repo ko nahi bula rahe")
          open("/tmp/slot", "w").write(hit)
          PY

      - name: Private repo ka pipeline jagay do
        run: |
          set -u
          slot=$(cat /tmp/slot)
          if [ -n "$slot" ]; then
            code=$(curl -s -o /tmp/d.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$PRIVATE_REPO/actions/workflows/$PRIVATE_WF/dispatches" \
              -d '{"ref":"master"}')
            echo "private repo ko $slot bheja -> HTTP $code"
            if [ "$code" != "204" ]; then
              echo "::error::dispatch nahi hua (HTTP $code)"
              cat /tmp/d.json || true
            fi
          else
            echo "kuch nahi bhejna"
          fi

      - name: Status page ka data likho
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from datetime import datetime, timezone

          TOKEN = os.environ["TOKEN"]
          PRIV = os.environ["PRIVATE_REPO"]
          SELF = os.environ["SELF_REPO"]
          API = "https://api.github.com"

          def req(url, data=None):
              r = urllib.request.Request(url, data=data,
                                         method="PUT" if data else "GET")
              r.add_header("Authorization", "Bearer " + TOKEN)
              r.add_header("Accept", "application/vnd.github+json")
              r.add_header("User-Agent", "alarm")
              if data:
                  r.add_header("Content-Type", "application/json")
              return json.load(urllib.request.urlopen(r, timeout=30))

          def read(repo, path):
              try:
                  j = req(f"{API}/repos/{repo}/contents/{path}")
                  return json.loads(base64.b64decode(j["content"])), j["sha"]
              except Exception:
                  return None, None

          # ---- private repo se post ka hisaab lein
          raw, _ = read(PRIV, "data/slot_posts.json")
          posts = []
          if isinstance(raw, dict):
              for v in raw.values():
                  if isinstance(v, dict) and v.get("at"):
                      posts.append({"at": v["at"], "slot": v.get("slot"),
                                    "video_id": v.get("video_id")})
          posts.sort(key=lambda p: p["at"], reverse=True)

          # ---- purana status dekho: har 2 minute naya commit na ho
          old, sha = read(SELF, "status.json")
          now = datetime.now(timezone.utc)
          if old and old.get("posts") == posts and old.get("alive_at"):
              try:
                  age = (now - datetime.fromisoformat(old["alive_at"])).total_seconds() / 60
                  if age < 20:
                      print(f"status naya hi hai ({age:.0f} min purana), chhora")
                      raise SystemExit(0)
              except (TypeError, ValueError):
                  pass

          out = {"updated_at": now.isoformat(),
                 "alive_at": now.isoformat(),
                 "posts": posts}
          body = json.dumps(out, indent=2, ensure_ascii=False).encode("utf-8")

          payload = {"message": "status update",
                     "content": base64.b64encode(body).decode(),
                     "branch": "main"}
          if sha:
              payload["sha"] = sha
          req(f"{API}/repos/{SELF}/contents/status.json", data=json.dumps(payload).encode())
          print(f"status likha: {len(posts)} posts")
          PY

      - name: 15 minute intezaar, phir KHUD ko dobara jagay do
        run: |
          sleep "$SLEEP"
          code=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$SELF_REPO/actions/workflows/$SELF_WF/dispatches" \
            -d '{"ref":"main"}')
          echo "zanjir aage barhaya -> HTTP $code"
          if [ "$code" != "204" ]; then
            echo "::error::self-dispatch nahi hua (HTTP $code)"
            cat /tmp/s.json || true
          fi
